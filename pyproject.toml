[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsqueeze"
version = "1.0.0"
description = "Token-efficient universal document reader for AI agents. Zero dependencies, adversarially hardened."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "docsqueeze contributors" }]
requires-python = ">=3.10"
keywords = ["pdf", "docx", "xlsx", "tokens", "llm", "agents", "context-window"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

[project.scripts]
docsqueeze = "docsqueeze.core:main"

[tool.setuptools]
packages = ["docsqueeze"]
